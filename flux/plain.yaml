apiVersion: apps/v1
kind: Deployment
metadata:
  name: plain-app
  namespace: rehearsal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plain-app
  template:
    metadata:
      labels:
        app: plain-app
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plain-cron
  namespace: rehearsal
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
              command:
                - sh
                - -c
                - echo cron
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: standin-for-database-cr
  namespace: rehearsal
data:
  note: stays untouched by the scale-down patches
