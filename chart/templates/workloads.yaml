apiVersion: apps/v1
kind: Deployment
metadata:
  name: chart-app
  namespace: rehearsal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chart-app
  template:
    metadata:
      labels:
        app: chart-app
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chart-cron
  namespace: rehearsal
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: run
              image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
              command:
                - sh
                - -c
                - echo cron
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chart-job
  namespace: rehearsal
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command:
            - sh
            - -c
            - echo job
